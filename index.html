<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ninja Jump</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #10141f;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top, 0px) 8px env(safe-area-inset-bottom, 0px);
  }
  canvas {
    display: block;
    background: #1b2233;
    border-radius: 10px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .55);
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="400" height="640"></canvas></div>
<script>
(() => {
  "use strict";

  // ==========================================================================
  //  YOUR ASSETS
  //  Drop your files in assets/ and point these at them. Anything left as ""
  //  — or any file that fails to load — falls back to the built-in drawing,
  //  so the game always runs even with an empty assets/ folder.
  //  See assets/README.md for sizes and formats.
  // ==========================================================================
  const ASSETS = {

    // ---- background -------------------------------------------------------
    // Tiled horizontally and scrolled. Any height works; it is scaled to fit.
    background: "assets/bg.png",
    bgScroll:   0.35,            // parallax speed, relative to the obstacles

    // ---- ground strip (optional) -----------------------------------------
    ground: "",                  // e.g. "assets/ground.png"

    // ---- obstacles --------------------------------------------------------
    // body is tiled along the column from the gap end outwards; cap, if given,
    // is drawn at the gap end (the pole art finishes itself, so none is used).
    obstacleBody: "assets/pole.png",
    obstacleCap:  "",

    // How much wider the body image is than the column itself, so decoration
    // that sticks out past the pole (the shuriken) can hang outside the
    // collision box instead of being squashed into it. 1 = art is the column.
    obstacleOverhang: 1.3029,

    // ---- audio ------------------------------------------------------------
    music:      "assets/music.mp3",
    musicVol:   0.45,
    sfxVol:     0.6,
    sfx: {
      jump:     "assets/sfx_jump.mp3",   // on every jump
      hit:      "assets/sfx_hit.mp3",    // the moment you clip a pole or the ground
      gameover: "assets/sfx_gameover.mp3", // once the ninja comes to rest
      score:    "assets/sfx_score.mp3",  // no file yet - synthesized blip stands in
    },

    // Frames to wait after the hit before the game-over sting, so the two
    // never stack. The hit clip is ~0.44s, so half a second clears it.
    gameOverDelay: 30,

    // ---- ninja sprites ----------------------------------------------------
    // Horizontal strips (all frames in one row) OR a grid — set rows/cols.
    // Leave `frames` at 0 to auto-detect assuming SQUARE frames.
    ninja: {
      drawH:   68,   // on-screen height in px. Does NOT change the hitbox.
      offsetX: 0,    // nudge the art if it does not sit centred
      offsetY: 0,

      // A single pose is just frames: 1. Give a slot a multi-frame strip and
      // it animates instead (e.g. swap stand for a run cycle later).
      stand: { src: "assets/ninja_stand.png", frames: 1, rows: 1, fps: 10, loop: true  },
      jump:  { src: "assets/ninja_jump.png",  frames: 1, rows: 1, fps: 14, loop: false },
      fall:  { src: "",                       frames: 0, rows: 1, fps: 10, loop: false },
    },

    // One full ninja flip per jump, in frames at 60fps. Higher = slower spin.
    spinFrames: 30,
  };

  // ==========================================================================
  //  Asset loading. Nothing here ever throws on a missing file — `ok` just
  //  stays false and the drawing code takes its procedural branch.
  // ==========================================================================
  let pending = 0, loadedAll = false;

  function loadImage(src) {
    const slot = { img: null, ok: false };
    if (!src) return slot;
    pending++;
    const img = new Image();
    img.onload = () => {
      slot.img = img;
      slot.ok = img.naturalWidth > 0;
      done();
    };
    img.onerror = done;
    img.src = src;
    return slot;
  }

  function loadSprite(spec) {
    const slot = { ok: false, img: null, fw: 0, fh: 0, n: 1, fps: spec.fps || 12, loop: !!spec.loop };
    if (!spec.src) return slot;
    pending++;
    const img = new Image();
    img.onload = () => {
      const rows = Math.max(1, spec.rows || 1);
      let cols;
      if (spec.frames > 0) {
        cols = Math.ceil(spec.frames / rows);
      } else if (rows === 1) {
        // assume square frames: a 6-frame strip of 64px art is 384x64
        cols = Math.max(1, Math.round(img.width / img.height));
      } else {
        cols = rows;
      }
      slot.img = img;
      slot.fw = img.width / cols;
      slot.fh = img.height / rows;
      slot.n = spec.frames > 0 ? spec.frames : cols * rows;
      slot.cols = cols;
      slot.ok = true;
      done();
    };
    img.onerror = done;
    img.src = spec.src;
    return slot;
  }

  function done() {
    if (--pending <= 0) loadedAll = true;
  }

  const IMG = {
    bg:   loadImage(ASSETS.background),
    grd:  loadImage(ASSETS.ground),
    body: loadImage(ASSETS.obstacleBody),
    cap:  loadImage(ASSETS.obstacleCap),
  };

  const SPR = {
    stand: loadSprite(ASSETS.ninja.stand),
    jump:  loadSprite(ASSETS.ninja.jump),
    fall:  loadSprite(ASSETS.ninja.fall),
  };

  // Art is taller than the hitbox, so ease off the tilt a little or the
  // sprite's head and feet swing much further than the collision circle.
  const usingSprites = () => SPR.stand.ok || SPR.jump.ok;
  const TILT = () => (usingSprites() ? 0.75 : 1);

  // Never let a stalled file hold the game hostage.
  setTimeout(() => { loadedAll = true; }, 2500);

  // ==========================================================================
  //  Audio. Music needs a user gesture before it may start, so it kicks off
  //  on the first flap. Missing sfx files fall back to short WebAudio blips.
  // ==========================================================================
  const SND = {
    music: null,
    muted: (load("ninjaJumpMuted") === "1"),
    started: false,
    sfx: {},
  };

  if (ASSETS.music) {
    const m = new Audio();
    m.src = ASSETS.music;
    m.loop = true;
    m.volume = ASSETS.musicVol;
    m.preload = "auto";
    m.addEventListener("error", () => { SND.music = null; });
    SND.music = m;
  }

  for (const k in ASSETS.sfx) {
    const src = ASSETS.sfx[k];
    if (!src) continue;
    const a = new Audio();
    a.src = src;
    a.preload = "auto";
    a.volume = ASSETS.sfxVol;
    a.addEventListener("error", () => { SND.sfx[k] = null; });
    SND.sfx[k] = a;
  }

  let actx = null;
  function blip(freq, dur, type) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, actx.currentTime);
      g.gain.setValueAtTime(ASSETS.sfxVol * 0.18, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) { /* no audio available */ }
  }

  const FALLBACK_SFX = {
    jump:     () => blip(520, 0.09, "square"),
    score:    () => blip(880, 0.12, "triangle"),
    hit:      () => blip(150, 0.30, "sawtooth"),
    gameover: () => blip(110, 0.55, "sawtooth"),
  };

  // Sounds that should restart rather than pile up on themselves.
  const NO_OVERLAP = { hit: true, gameover: true };

  function playSfx(name) {
    if (SND.muted) return;
    const a = SND.sfx[name];
    // Only a load error nulls the slot, so don't gate on readyState here:
    // a file that simply hasn't finished decoding yet would fall through to
    // the blip and you'd hear the placeholder instead of the real sound.
    if (a) {
      try {
        const el = NO_OVERLAP[name] ? a : a.cloneNode();  // clone so rapid jumps overlap
        el.volume = ASSETS.sfxVol;
        try { el.currentTime = 0; } catch (e) { /* not seekable yet */ }
        const pr = el.play();
        if (pr && pr.catch) pr.catch(() => { if (FALLBACK_SFX[name]) FALLBACK_SFX[name](); });
        return;
      } catch (e) { /* fall through to the blip */ }
    }
    if (FALLBACK_SFX[name]) FALLBACK_SFX[name]();
  }

  function stopSfx(name) {
    const a = SND.sfx[name];
    if (!a) return;
    try { a.pause(); a.currentTime = 0; } catch (e) { /* nothing playing */ }
  }

  function startMusic() {
    if (!SND.music || SND.started || SND.muted) return;
    SND.music.play().then(() => { SND.started = true; }).catch(() => {});
  }

  function setMuted(v) {
    SND.muted = v;
    save("ninjaJumpMuted", v ? "1" : "0");
    if (v) { for (const k in SND.sfx) stopSfx(k); }
    if (SND.music) {
      if (v) { SND.music.pause(); }
      else { SND.music.play().then(() => { SND.started = true; }).catch(() => {}); }
    }
  }

  const W = 400, H = 640;
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  // ---------------------------------------------------------------- tuning
  const GRAVITY       = 0.42;
  const FLAP_VELOCITY = -7.4;
  const MAX_FALL      = 11;
  const SCROLL_SPEED  = 2.5;
  const GATE_SPACING  = 190;   // horizontal distance between gates
  const GATE_GAP      = 172;   // vertical opening, shrinks slightly with score
  const MIN_GAP       = 136;
  const GROUND_H      = 76;
  const NINJA_X       = 120;
  const NINJA_R       = 17;    // collision radius (torso only - see README)

  const STATE = { READY: 0, PLAYING: 1, DEAD: 2 };
  const DEAD_ROT = 1.9;   // head-down tumble the ninja settles into on death

  // ---------------------------------------------------------------- state
  let state, ninja, gates, particles, stars, clouds, score, best, frame;
  let shake = 0, flash = 0, deadTimer = 0, groundOffset = 0, bgOffset = 0, gameOverPlayed = false;

  best = Number(load("ninjaJumpBest") || 0);

  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } }

  // Where the ninja stands before take-off: feet planted on the ground.
  // Clamped so a large drawH can never start the hitbox inside the ground.
  function standY() {
    const artH = usingSprites() ? ASSETS.ninja.drawH : NINJA_R * 2;
    const feet = H - GROUND_H - artH / 2 - ASSETS.ninja.offsetY;
    const safe = H - GROUND_H - NINJA_R - 2;
    return Math.min(feet, safe);
  }

  function reset() {
    // a retry mid-sting should cut it off, not talk over the new run
    stopSfx("gameover");
    stopSfx("hit");
    gameOverPlayed = false;

    state = STATE.READY;
    ninja = { y: standY(), vy: 0, rot: 0, trail: [], anim: "stand", animT: 0, spinT: 0 };
    gates = [];
    particles = [];
    score = 0;
    frame = 0;
    shake = 0;
    flash = 0;
    deadTimer = 0;
    for (let i = 0; i < 4; i++) spawnGate(W + 220 + i * GATE_SPACING);

    stars = [];
    for (let i = 0; i < 40; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * (H - GROUND_H - 120),
        r: Math.random() * 1.3 + .4,
        tw: Math.random() * Math.PI * 2
      });
    }
    clouds = [];
    for (let i = 0; i < 5; i++) {
      clouds.push({
        x: Math.random() * W,
        y: 60 + Math.random() * 220,
        s: .55 + Math.random() * .7,
        v: .16 + Math.random() * .22
      });
    }
  }

  function currentGap() {
    return Math.max(MIN_GAP, GATE_GAP - Math.floor(score / 5) * 5);
  }

  function spawnGate(x) {
    const gap = currentGap();
    const margin = 70;
    const top = margin + Math.random() * (H - GROUND_H - gap - margin * 2);
    gates.push({ x, top, gap, scored: false });
  }

  // ---------------------------------------------------------------- input
  function flap() {
    startMusic();
    if (state === STATE.READY) {
      state = STATE.PLAYING;
      ninja.vy = FLAP_VELOCITY;
      ninja.spinT = ASSETS.spinFrames;
      puff(NINJA_X, H - GROUND_H - 4, "#b9a48a", 10);   // dust off the ground
      playSfx("jump");
    } else if (state === STATE.PLAYING) {
      ninja.vy = FLAP_VELOCITY;
      ninja.spinT = ASSETS.spinFrames;                  // restart the flip
      puff(NINJA_X - 6, ninja.y + 12, "#9fb4d8", 5);
      playSfx("jump");
    } else if (state === STATE.DEAD && deadTimer > 45) {
      reset();
    }
  }

  function onKey(e) {
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Enter") {
      e.preventDefault();
      flap();
    } else if (e.code === "KeyM") {
      setMuted(!SND.muted);
    }
  }

  // speaker button, top-right
  const MUTE_BTN = { x: W - 46, y: 12, w: 34, h: 34 };

  function toCanvas(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    return { x: (clientX - r.left) * (W / r.width), y: (clientY - r.top) * (H / r.height) };
  }

  function onPoint(clientX, clientY) {
    const p = toCanvas(clientX, clientY);
    if (p.x >= MUTE_BTN.x - 6 && p.x <= MUTE_BTN.x + MUTE_BTN.w + 6 &&
        p.y >= MUTE_BTN.y - 6 && p.y <= MUTE_BTN.y + MUTE_BTN.h + 6) {
      setMuted(!SND.muted);
      return;                       // tapping the speaker must not also flap
    }
    flap();
  }

  window.addEventListener("keydown", onKey, { passive: false });
  canvas.addEventListener("mousedown", e => { e.preventDefault(); onPoint(e.clientX, e.clientY); });
  canvas.addEventListener("touchstart", e => {
    e.preventDefault();
    const t = e.changedTouches[0];
    onPoint(t.clientX, t.clientY);
  }, { passive: false });

  // ---------------------------------------------------------------- effects
  function puff(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      particles.push({
        x, y,
        vx: -Math.random() * 2.2 - .4,
        vy: (Math.random() - .5) * 2.2,
        life: 1,
        decay: .03 + Math.random() * .03,
        r: Math.random() * 3.5 + 1.5,
        color
      });
    }
  }

  function burst(x, y) {
    for (let i = 0; i < 26; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = Math.random() * 5.5 + 1;
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 1.5,
        life: 1,
        decay: .018 + Math.random() * .02,
        r: Math.random() * 4 + 2,
        color: Math.random() < .5 ? "#e94f52" : "#ffd36e"
      });
    }
  }

  // ---------------------------------------------------------------- update
  function update() {
    frame++;
    if (shake > 0) shake *= .88;
    if (flash > 0) flash -= .06;
    updateAnim();

    const moving = state === STATE.PLAYING ? 1 : 0;
    bgOffset += SCROLL_SPEED * ASSETS.bgScroll * moving;

    for (const c of clouds) {
      c.x -= c.v * (state === STATE.PLAYING ? 1 : .4);
      if (c.x < -90) { c.x = W + 60; c.y = 60 + Math.random() * 220; }
    }

    if (state === STATE.READY) {
      // planted, not floating - the world only starts moving on take-off
      ninja.y = standY();
      ninja.rot = 0;
      ninja.spinT = 0;
    }

    if (state === STATE.PLAYING) {
      groundOffset += SCROLL_SPEED;

      ninja.vy = Math.min(ninja.vy + GRAVITY, MAX_FALL);
      ninja.y += ninja.vy;

      if (ninja.spinT > 0) {
        ninja.spinT--;
        // On the last frame snap to 0 rather than 2pi. They are the same
        // picture, but 2pi is a long way from the tilt target numerically,
        // so leaving it there makes the lerp unwind the whole turn backwards.
        ninja.rot = ninja.spinT > 0
          ? Math.PI * 2 * (1 - ninja.spinT / ASSETS.spinFrames)
          : 0;
      } else {
        // nose follows velocity: up-tilt on a flap, dive when falling
        const target = Math.max(-0.5, Math.min(1.35, ninja.vy / 11)) * TILT();
        ninja.rot += (target - ninja.rot) * .16;
      }

      ninja.trail.push({ x: NINJA_X, y: ninja.y });
      if (ninja.trail.length > 9) ninja.trail.shift();

      for (const g of gates) {
        g.x -= SCROLL_SPEED;
        if (!g.scored && g.x + 26 < NINJA_X) {
          g.scored = true;
          score++;
          flash = .35;
          playSfx("score");
          if (score > best) { best = score; save("ninjaJumpBest", best); }
        }
      }
      if (gates.length && gates[0].x < -70) gates.shift();
      const last = gates[gates.length - 1];
      if (last && last.x < W) spawnGate(last.x + GATE_SPACING);

      if (hits()) die();
    }

    if (state === STATE.DEAD) {
      deadTimer++;
      // fall to the ground, then stop
      let atRest = true;
      if (ninja.y < H - GROUND_H - NINJA_R) {
        ninja.vy = Math.min(ninja.vy + GRAVITY, MAX_FALL);
        ninja.y += ninja.vy;
        atRest = false;
      } else {
        ninja.y = H - GROUND_H - NINJA_R;
        ninja.vy = 0;
      }
      // keep tumbling head-down even after landing, so a ninja that dies at
      // ground level still settles into the pose instead of freezing mid-flip
      ninja.rot += (DEAD_ROT - ninja.rot) * .12;

      // sting lands on the thud, but never on top of the hit sound
      if (!gameOverPlayed && atRest && deadTimer >= ASSETS.gameOverDelay) {
        gameOverPlayed = true;
        playSfx("gameover");
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += .14;
      p.life -= p.decay;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  // Which clip plays: running in place before take-off, the jump clip while
  // rising, and the fall clip (when supplied) on the way down.
  function pickAnim() {
    if (state === STATE.READY) return "stand";
    if (state === STATE.DEAD)  return SPR.fall.ok ? "fall" : "jump";
    if (ninja.vy < 0)          return "jump";
    return SPR.fall.ok ? "fall" : "jump";
  }

  function updateAnim() {
    const want = pickAnim();
    if (want !== ninja.anim) { ninja.anim = want; ninja.animT = 0; }
    else ninja.animT++;
  }

  function animFrame(spr) {
    const i = Math.floor(ninja.animT * spr.fps / 60);
    return spr.loop ? i % spr.n : Math.min(i, spr.n - 1);
  }

  function hits() {
    if (ninja.y + NINJA_R >= H - GROUND_H) return true;
    if (ninja.y - NINJA_R <= 0) { ninja.y = NINJA_R; ninja.vy = 0; }  // bonk on the ceiling, not a loss

    for (const g of gates) {
      const left = g.x, w = 52;
      if (NINJA_X + NINJA_R < left || NINJA_X - NINJA_R > left + w) continue;
      const botY = g.top + g.gap;
      if (circleRect(NINJA_X, ninja.y, NINJA_R, left, 0, w, g.top)) return true;
      if (circleRect(NINJA_X, ninja.y, NINJA_R, left, botY, w, H - GROUND_H - botY)) return true;
    }
    return false;
  }

  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  function die() {
    state = STATE.DEAD;
    deadTimer = 0;
    shake = 14;
    ninja.vy = -4;
    ninja.spinT = 0;
    // a flip can leave rot anywhere up to 2pi; fold it back to (-pi, pi] so
    // the death tumble eases from where the sprite actually is
    ninja.rot = ((ninja.rot + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
    burst(NINJA_X, ninja.y);
    playSfx("hit");
  }

  // ---------------------------------------------------------------- draw
  function draw() {
    ctx.save();
    if (shake > .4) {
      ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
    }

    drawSky();
    if (!IMG.bg.ok) {
      drawStars();
      drawMountains();
      drawClouds();
    }
    for (const g of gates) drawGate(g);
    drawGround();
    drawParticles();
    drawNinja();

    ctx.restore();

    if (flash > 0) {
      ctx.fillStyle = "rgba(255,255,255," + (flash * .18) + ")";
      ctx.fillRect(0, 0, W, H);
    }

    drawUI();
    drawSpeaker();
    if (!loadedAll) drawLoading();
  }

  function drawSky() {
    if (IMG.bg.ok) {
      // scaled to cover the full height, tiled horizontally, wrapping
      const img = IMG.bg.img;
      const w = Math.max(1, img.width * (H / img.height));
      let x = -(bgOffset % w);
      while (x < W) { ctx.drawImage(img, x, 0, w, H); x += w; }
      return;
    }

    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#1a1f38");
    g.addColorStop(.45, "#38335a");
    g.addColorStop(.78, "#a05a6e");
    g.addColorStop(1, "#e8896a");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // big moon
    ctx.fillStyle = "rgba(255, 236, 200, .92)";
    ctx.beginPath();
    ctx.arc(302, 104, 42, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(226, 198, 160, .55)";
    ctx.beginPath(); ctx.arc(288, 94, 8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(314, 120, 6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(318, 88, 4.5, 0, Math.PI * 2); ctx.fill();
  }

  function drawStars() {
    for (const s of stars) {
      const a = .35 + Math.abs(Math.sin(frame / 50 + s.tw)) * .55;
      ctx.fillStyle = "rgba(255,255,255," + a + ")";
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawMountains() {
    const baseY = H - GROUND_H;
    ctx.fillStyle = "#2c2a48";
    ctx.beginPath();
    ctx.moveTo(-20, baseY);
    ctx.lineTo(60, baseY - 150);
    ctx.lineTo(120, baseY - 60);
    ctx.lineTo(190, baseY - 190);
    ctx.lineTo(260, baseY - 70);
    ctx.lineTo(330, baseY - 160);
    ctx.lineTo(W + 20, baseY);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#3a3358";
    ctx.beginPath();
    ctx.moveTo(-20, baseY);
    ctx.lineTo(40, baseY - 70);
    ctx.lineTo(110, baseY - 30);
    ctx.lineTo(180, baseY - 95);
    ctx.lineTo(250, baseY - 40);
    ctx.lineTo(320, baseY - 85);
    ctx.lineTo(W + 20, baseY - 20);
    ctx.lineTo(W + 20, baseY);
    ctx.closePath();
    ctx.fill();
  }

  function drawClouds() {
    ctx.fillStyle = "rgba(220, 210, 235, .18)";
    for (const c of clouds) {
      const s = c.s;
      ctx.beginPath();
      ctx.arc(c.x, c.y, 20 * s, 0, Math.PI * 2);
      ctx.arc(c.x + 22 * s, c.y + 5 * s, 15 * s, 0, Math.PI * 2);
      ctx.arc(c.x - 22 * s, c.y + 6 * s, 13 * s, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawGate(g) {
    const w = 52;
    const botY = g.top + g.gap;
    drawBamboo(g.x, 0, w, g.top, false);
    drawBamboo(g.x, botY, w, H - GROUND_H - botY, true);
  }

  function drawBamboo(x, y, w, h, capOnTop) {
    if (h <= 0) return;

    if (IMG.body.ok) {
      const img = IMG.body.img;
      // Scale so the COLUMN matches w; art wider than the column (shuriken
      // stuck through the pole) then overhangs on both sides, as drawn.
      const tw = w * ASSETS.obstacleOverhang;
      const tx = x + w / 2 - tw / 2;
      const th = Math.max(1, img.height * (tw / img.width));  // tile at natural aspect

      ctx.save();
      // clip vertically only: the column must not bleed into the gap, but the
      // overhang has to stay visible, so don't clip it to the column width
      ctx.beginPath();
      ctx.rect(0, y, W, h);
      ctx.clip();
      // tile from the gap end outwards, so the finished end of the art always
      // lands on the gap and any seam is pushed off-screen
      if (capOnTop) {
        for (let ty = y; ty < y + h; ty += th) ctx.drawImage(img, tx, ty, tw, th);
      } else {
        for (let ty = y + h - th; ty > y - th; ty -= th) ctx.drawImage(img, tx, ty, tw, th);
      }
      ctx.restore();

      if (IMG.cap.ok) {
        const cimg = IMG.cap.img;
        const cw = w + 8;
        const ch = Math.max(1, cimg.height * (cw / cimg.width));
        const cy = capOnTop ? y : y + h - ch;
        ctx.save();
        if (capOnTop) {
          // ground column: cap sits at the top of it, drawn as authored
          ctx.drawImage(cimg, x - 4, cy, cw, ch);
        } else {
          // ceiling column: cap hangs under it, so flip it vertically
          ctx.translate(x - 4, cy + ch);
          ctx.scale(1, -1);
          ctx.drawImage(cimg, 0, 0, cw, ch);
        }
        ctx.restore();
      }
      return;
    }

    const grad = ctx.createLinearGradient(x, 0, x + w, 0);
    grad.addColorStop(0, "#3f7d4a");
    grad.addColorStop(.32, "#6fbf74");
    grad.addColorStop(.62, "#54a05c");
    grad.addColorStop(1, "#2f5f38");
    ctx.fillStyle = grad;
    ctx.fillRect(x, y, w, h);

    // segment nodes: a shadowed groove with a lit ridge under it,
    // which is what makes a green tube read as bamboo
    const start = capOnTop ? y + 34 : y + (h % 44);
    for (let sy = start; sy < y + h - 6; sy += 44) {
      ctx.fillStyle = "rgba(22, 54, 28, .5)";
      ctx.fillRect(x + 1, sy - 2, w - 2, 3);
      ctx.fillStyle = "rgba(168, 226, 168, .3)";
      ctx.fillRect(x + 1, sy + 1, w - 2, 2);
      // little stub where a branch would leave the culm
      ctx.fillStyle = "rgba(30, 70, 36, .45)";
      ctx.fillRect(x + w - 9, sy + 3, 6, 4);
    }

    // vertical highlight down the culm
    ctx.fillStyle = "rgba(190, 240, 190, .12)";
    ctx.fillRect(x + 11, y, 5, h);

    // shaded cap at the gap edge
    const capY = capOnTop ? y : y + h - 16;
    const capGrad = ctx.createLinearGradient(x - 4, 0, x + w + 4, 0);
    capGrad.addColorStop(0, "#356b3f");
    capGrad.addColorStop(.35, "#7cd182");
    capGrad.addColorStop(1, "#2a5633");
    ctx.fillStyle = capGrad;
    ctx.fillRect(x - 4, capY, w + 8, 16);
    ctx.strokeStyle = "rgba(16, 40, 20, .6)";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x - 4 + .75, capY + .75, w + 8 - 1.5, 16 - 1.5);
  }

  function drawGround() {
    const y = H - GROUND_H;

    if (IMG.grd.ok) {
      const img = IMG.grd.img;
      const w = Math.max(1, img.width * (GROUND_H / img.height));
      let x = -(groundOffset % w);
      while (x < W) { ctx.drawImage(img, x, y, w, GROUND_H); x += w; }
      return;
    }

    ctx.fillStyle = "#4a3b52";
    ctx.fillRect(0, y, W, GROUND_H);

    ctx.fillStyle = "#5b4864";
    ctx.fillRect(0, y, W, 10);

    // scrolling roof-tile stripes
    ctx.fillStyle = "rgba(0,0,0,.16)";
    for (let x = -(groundOffset % 40); x < W; x += 40) {
      ctx.beginPath();
      ctx.moveTo(x, y + 10);
      ctx.lineTo(x + 20, y + 10);
      ctx.lineTo(x + 8, GROUND_H + y);
      ctx.lineTo(x - 12, GROUND_H + y);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = "rgba(255,255,255,.07)";
    ctx.fillRect(0, y + 10, W, 2);
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawNinja() {
    const spr = SPR[ninja.anim];
    if (spr && spr.ok) { drawNinjaSprite(spr); return; }

    // motion trail (procedural ninja only - a real sprite has its own motion)
    if (state === STATE.PLAYING) {
      for (let i = 0; i < ninja.trail.length; i++) {
        const t = ninja.trail[i];
        const a = (i / ninja.trail.length) * .22;
        ctx.fillStyle = "rgba(60, 70, 100," + a + ")";
        ctx.beginPath();
        ctx.arc(t.x - (ninja.trail.length - i) * 3.2, t.y, NINJA_R * (i / ninja.trail.length), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    ctx.save();
    ctx.translate(NINJA_X, ninja.y);
    ctx.rotate(ninja.rot);

    // scarf, trailing behind and flapping
    const wag = Math.sin(frame / 5) * 5;
    ctx.fillStyle = "#e94f52";
    ctx.beginPath();
    ctx.moveTo(-6, -4);
    ctx.quadraticCurveTo(-22, -8 + wag, -34, 2 + wag * 1.6);
    ctx.quadraticCurveTo(-22, 2 + wag, -6, 6);
    ctx.closePath();
    ctx.fill();

    // body
    ctx.fillStyle = "#222a3d";
    ctx.beginPath();
    ctx.ellipse(0, 2, 15, 13, 0, 0, Math.PI * 2);
    ctx.fill();

    // head wrap
    ctx.fillStyle = "#2c3550";
    ctx.beginPath();
    ctx.arc(4, -6, 11, 0, Math.PI * 2);
    ctx.fill();

    // eye band
    ctx.fillStyle = "#f2efe6";
    ctx.beginPath();
    ctx.ellipse(7, -7, 7, 4, -.15, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#1a1f2e";
    const blink = (frame % 200) < 6 && state !== STATE.DEAD;
    if (state === STATE.DEAD) {
      // X eyes
      ctx.strokeStyle = "#1a1f2e";
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(6, -10); ctx.lineTo(12, -4);
      ctx.moveTo(12, -10); ctx.lineTo(6, -4);
      ctx.stroke();
    } else if (!blink) {
      ctx.beginPath();
      ctx.arc(9, -7, 2.4, 0, Math.PI * 2);
      ctx.fill();
    }

    // scarf knot
    ctx.fillStyle = "#c73f45";
    ctx.fillRect(-8, -12, 5, 8);

    // arms: flung back on a flap, tucked otherwise
    ctx.strokeStyle = "#222a3d";
    ctx.lineWidth = 4;
    ctx.lineCap = "round";
    const armY = ninja.vy < 0 ? 10 : -2;
    ctx.beginPath();
    ctx.moveTo(-2, 4);
    ctx.lineTo(-12, 4 + armY);
    ctx.stroke();

    ctx.restore();
  }

  function drawNinjaSprite(spr) {
    const i  = animFrame(spr);
    const sx = (i % (spr.cols || spr.n)) * spr.fw;
    const sy = Math.floor(i / (spr.cols || spr.n)) * spr.fh;

    const h = ASSETS.ninja.drawH;
    const w = h * (spr.fw / spr.fh);

    ctx.save();
    ctx.translate(NINJA_X + ASSETS.ninja.offsetX, ninja.y + ASSETS.ninja.offsetY);
    ctx.rotate(ninja.rot);
    ctx.drawImage(spr.img, sx, sy, spr.fw, spr.fh, -w / 2, -h / 2, w, h);
    ctx.restore();
  }

  function drawUI() {
    ctx.textAlign = "center";

    if (state === STATE.PLAYING || state === STATE.DEAD) {
      ctx.font = "bold 52px 'Trebuchet MS', sans-serif";
      ctx.lineWidth = 6;
      ctx.strokeStyle = "rgba(0,0,0,.55)";
      ctx.strokeText(score, W / 2, 96);
      ctx.fillStyle = "#fff";
      ctx.fillText(score, W / 2, 96);
    }

    if (state === STATE.READY) {
      panel(W / 2, 96, 300, best > 0 ? 132 : 106);
      ctx.fillStyle = "#ffd36e";
      ctx.font = "bold 40px 'Trebuchet MS', sans-serif";
      ctx.fillText("NINJA JUMP", W / 2, 142);
      ctx.fillStyle = "#cfd6e6";
      ctx.font = "16px 'Trebuchet MS', sans-serif";
      ctx.fillText("Tap, click or press Space to jump", W / 2, 170);
      ctx.fillStyle = "#8e98b2";
      ctx.font = "14px 'Trebuchet MS', sans-serif";
      ctx.fillText("slip through the gaps", W / 2, 192);
      if (best > 0) {
        ctx.fillStyle = "#ffd36e";
        ctx.font = "bold 15px 'Trebuchet MS', sans-serif";
        ctx.fillText("Best  " + best, W / 2, 216);
      }

      // bobbing arrow, sitting just above the ninja
      const bob = Math.sin(frame / 14) * 4;
      ctx.fillStyle = "rgba(255,255,255," + (.5 + Math.sin(frame / 14) * .35) + ")";
      ctx.font = "bold 22px 'Trebuchet MS', sans-serif";
      const headroom = (usingSprites() ? ASSETS.ninja.drawH : NINJA_R * 2) / 2 + 16;
      ctx.fillText("\u25B2", NINJA_X, ninja.y - headroom + bob);
    }

    if (state === STATE.DEAD) {
      const a = Math.min(1, deadTimer / 20);
      ctx.globalAlpha = a;
      panel(W / 2, 200, 264, 190);

      ctx.fillStyle = "#e94f52";
      ctx.font = "bold 34px 'Trebuchet MS', sans-serif";
      ctx.fillText("WIPEOUT", W / 2, 240);

      ctx.fillStyle = "#9aa4bd";
      ctx.font = "14px 'Trebuchet MS', sans-serif";
      ctx.fillText("SCORE", W / 2 - 58, 282);
      ctx.fillText("BEST", W / 2 + 58, 282);

      ctx.fillStyle = "#fff";
      ctx.font = "bold 32px 'Trebuchet MS', sans-serif";
      ctx.fillText(score, W / 2 - 58, 316);
      ctx.fillStyle = score >= best && score > 0 ? "#ffd36e" : "#fff";
      ctx.fillText(best, W / 2 + 58, 316);

      if (score >= best && score > 0) {
        ctx.fillStyle = "#ffd36e";
        ctx.font = "bold 14px 'Trebuchet MS', sans-serif";
        ctx.fillText("NEW BEST!", W / 2, 346);
      }

      if (deadTimer > 45) {
        ctx.fillStyle = "rgba(255,255,255," + (.5 + Math.sin(frame / 10) * .35) + ")";
        ctx.font = "16px 'Trebuchet MS', sans-serif";
        ctx.fillText("Tap or press Space to retry", W / 2, 378);
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawSpeaker() {
    const b = MUTE_BTN;
    ctx.save();
    ctx.globalAlpha = .75;
    ctx.fillStyle = "rgba(16, 20, 34, .55)";
    roundRect(b.x, b.y, b.w, b.h, 9);
    ctx.fill();

    const cx = b.x + 12, cy = b.y + b.h / 2;
    ctx.fillStyle = "#e6ebf6";
    ctx.beginPath();
    ctx.moveTo(cx - 5, cy - 3);
    ctx.lineTo(cx - 1, cy - 3);
    ctx.lineTo(cx + 4, cy - 8);
    ctx.lineTo(cx + 4, cy + 8);
    ctx.lineTo(cx - 1, cy + 3);
    ctx.lineTo(cx - 5, cy + 3);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = "#e6ebf6";
    ctx.lineWidth = 1.8;
    ctx.lineCap = "round";
    if (SND.muted) {
      ctx.beginPath();
      ctx.moveTo(cx + 9, cy - 5);
      ctx.lineTo(cx + 17, cy + 5);
      ctx.moveTo(cx + 17, cy - 5);
      ctx.lineTo(cx + 9, cy + 5);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(cx + 5, cy, 6, -.9, .9);
      ctx.moveTo(cx + 13.5, cy - 6.5);
      ctx.arc(cx + 5, cy, 10, -.8, .8);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawLoading() {
    ctx.fillStyle = "rgba(8, 10, 18, .82)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#cfd6e6";
    ctx.font = "16px 'Trebuchet MS', sans-serif";
    ctx.fillText("loading" + ".".repeat(1 + (Math.floor(frame / 20) % 3)), W / 2, H / 2);
  }

  function panel(cx, y, w, h) {
    const x = cx - w / 2;
    ctx.fillStyle = "rgba(16, 20, 34, .78)";
    roundRect(x, y, w, h, 14);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.12)";
    ctx.lineWidth = 1.5;
    roundRect(x, y, w, h, 14);
    ctx.stroke();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ---------------------------------------------------------------- loop
  // Fixed 60Hz logic step so the game plays identically on 120Hz displays.
  const STEP = 1000 / 60;
  let acc = 0, prev = performance.now();

  function loop(now) {
    acc += Math.min(now - prev, 250);   // clamp after a tab switch
    prev = now;
    while (acc >= STEP) {
      update();
      acc -= STEP;
    }
    draw();
    requestAnimationFrame(loop);
  }

  // Crisp on high-DPI screens, and letterboxed to fit the viewport
  // without ever distorting the 400x640 play field.
  function fit() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);

    const avail = document.getElementById("wrap").getBoundingClientRect();
    const scale = Math.min((avail.width - 16) / W, avail.height / H, 1.4);
    canvas.style.width = Math.floor(W * scale) + "px";
    canvas.style.height = Math.floor(H * scale) + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = true;
  }

  window.addEventListener("resize", fit);
  fit();
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
